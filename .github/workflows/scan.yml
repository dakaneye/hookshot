name: Vulnerability Scan

on:
  workflow_call:
    inputs:
      severity-cutoff:
        description: "Minimum severity to report (negligible, low, medium, high, critical)"
        type: string
        required: false
        default: "high"
      fail-build:
        description: "Fail the build on findings"
        type: boolean
        required: false
        default: false
      only-fixed:
        description: "Only report vulnerabilities with available fixes"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grype filesystem scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          path: "."
          fail-build: ${{ inputs.fail-build }}
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
